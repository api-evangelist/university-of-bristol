apis:
  - aid: university-of-bristol:research-portal-oai-pmh
    name: University of Bristol Research Portal OAI-PMH
    x-operator: institution
    description: >-
      The one institution-operated, keyless, machine-readable API surface the University of Bristol
      publishes. OAI-PMH 2.0 metadata harvesting for the University of Bristol Research Portal,
      served from the university's own registrable domain under its own identifier namespace
      (oai:research-information.bris.ac.uk:...). Seven metadata formats are supported — mods, qdc,
      oai_dc, oai_cerif_openaire (OpenAIRE CERIF profile 1.2), xmetadiss, nl_didl and uketd_dc —
      across 3,878 sets, and ListRecords with oai_dc reports a completeListSize of 590,974 with a
      page size of 100. Five of the six verbs execute anonymously; Identify returns HTTP 500 with a
      Pure HTML error page, so the repository cannot describe itself, and that defect is recorded
      rather than smoothed over. The research-information system behind the portal is Elsevier
      Pure, but this interface is an open protocol on the institution's host under the
      institution's identity — Elsevier's own product API at /ws/api is a separate, vendor-owned
      surface and is recorded below as a tenant relationship, not as Bristol's.
