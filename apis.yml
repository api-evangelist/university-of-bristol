description: >-
  The University of Bristol is a public research university in Bristol, United Kingdom, and a
  member of the Russell Group. Its programmable footprint is small, real, and mostly indirect: it
  operates no developer portal, no open-data platform and no central API programme, and
  api.bris.ac.uk, developer.bristol.ac.uk, timetable.bristol.ac.uk and status.bristol.ac.uk do not
  resolve. The one institution-operated, keyless, machine-readable API surface found is the
  University of Bristol Research Portal OAI-PMH 2.0 endpoint at research-information.bris.ac.uk,
  which advertises 590,974 records across 3,878 sets in seven metadata formats including the
  OpenAIRE CERIF 1.2 profile, with no authentication — although its mandatory Identify verb
  returns HTTP 500. Beyond it, Bristol operates a Shibboleth SAML 2.0 identity provider registered
  in the UK Access Management Federation since 2010 and asserting REFEDS Research & Scholarship,
  and data.bris, its own research data repository, which has minted 1,552 DataCite DOIs under the
  institution's own prefix 10.5523/bris since 2012. Everything else that looks like a Bristol API
  is a vendor's contract running under Bristol's name — Elsevier Pure for the research portal's
  /ws/api web services, OCLC WorldCat Discovery for library search. Those relationships are
  recorded here as tenant surfaces; the vendors' contracts are not.
