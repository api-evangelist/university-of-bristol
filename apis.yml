x-coverage:
  state: covered
  reason: covered
  detail: >-
    One institution-operated, keyless, machine-readable API surface was found, verified and
    catalogued — the University of Bristol Research Portal OAI-PMH 2.0 endpoint at
    research-information.bris.ac.uk/ws/oai, advertising 590,974 records across 3,878 sets in seven
    metadata formats including the OpenAIRE CERIF 1.2 profile, with every tested verb executing
    anonymously. Two live defects were observed there and are documented rather than hidden:
    verb=Identify returns HTTP 500 with an HTML page instead of the mandatory OAI-PMH
    self-description, and ListRecords under oai_cerif_openaire for openaire_cris_persons returns an
    empty first page while advertising completeListSize=9750. Two further institution-operated
    surfaces were confirmed: the Shibboleth SAML 2.0 identity provider at idp.bris.ac.uk, in the UK
    Access Management Federation since 2010-09-09 asserting REFEDS Research & Scholarship; and
    data.bris, Bristol's own research data repository, DataCite client BL.BRISTOL with 1,552 DOIs
    under prefix 10.5523/bris. Coverage is otherwise thin because it genuinely is: Bristol operates
    no developer portal and no open-data platform, and api.bris.ac.uk, developer.bristol.ac.uk,
    developer.bris.ac.uk, timetable.bristol.ac.uk, status.bristol.ac.uk and library-search.bristol.ac.uk
    do not resolve. The unit-programme-catalogue is a legacy JSP application that serves an
    obfuscated JavaScript shim to a plain client and 403s on its .jsa endpoints, so there is no
    course-catalog API. Two surface classes that look institutional are vendor contracts and are
    recorded as tenant relationships without their contracts — Elsevier Pure at /ws/api on
    Bristol's own host, and OCLC WorldCat Discovery at bris.on.worldcat.org. data.bris.ac.uk/data/
    is the one genuinely broken institutional surface: HTTP 200 carrying a 504 Gateway Timeout body,
    then connection resets, so all 1,552 DataCite DOIs currently resolve to an unreachable page.
    www.linkedin.com returns 999 to non-browser clients; that is a bot block, and the pointer is
    LIVE, not dead.
