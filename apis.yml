    name: Elsevier Pure Web Services (University of Bristol tenancy)
    x-operator: tenant
    description: >-
      TENANT RELATIONSHIP, NOT A BRISTOL CONTRACT. Bristol runs Elsevier Pure as its research
      information system, and Pure's product API answers on Bristol's own host at
      research-information.bris.ac.uk/ws/api. The data is Bristol's; the contract is Elsevier's.
      The live OpenAPI at /ws/api/openapi.json (200, 1,740,065 bytes) declares info.title "Pure
      API", info.contact.email pure-support@elsevier.com, version 5.35.3-4 and a RELATIVE
      servers[] entry of /ws/api across 826 paths — a hostless spec that a host-based verdict
      cannot classify, which is exactly the class this pipeline exists to catch. Access is api-key
      gated with no self-serve issuance: GET /ws/api/524/research-outputs returned 401. Per
      pipeline-university.md the relationship is recorded and the vendor's contract is NOT saved
      under this institution's slug; it belongs to Elsevier's own repo. A hand-authored 493-line
      subset of it, plus twenty-nine artifacts derived from it, were removed from this repository
      on 2026-08-30 — see x-attribution-correction.
    humanURL: https://research-information.bris.ac.uk/ws/api/524/api-docs/index.html
