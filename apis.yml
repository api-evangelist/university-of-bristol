x-attribution-correction:
  applied: '2026-08-30'
  by: pipeline-university.md STEP 6b, file-by-file
  removed_entries: 4
  removed_files: 30
  what: >-
    Four apis[] entries and thirty artifact files, all derived from ONE saved copy of Elsevier's
    Pure product contract. openapi/_original/university-of-bristol-pure-research-api.yaml carried
    info.title "Pure API" and a description that names "the University of Bristol Research Portal
    (Pure, by Elsevier)" outright; it was a hand-authored 493-line read-only subset of a vendor
    document, and it rewrote the contact from Elsevier's real pure-support@elsevier.com to a
    pure-support@bristol.ac.uk address that does not appear in the live specification, and stated
    version 5.34.1 where the live document says 5.35.3-4. refine-openapis then split it into four
    per-tag documents (data-set, person, project, research-output) and four apis[] entries,
    three JSON Schemas, three JSON Structures, three example sets, eight collection documents, a
    JSON-LD context, a vocabulary, two rulesets, an agentic-access card, capability edges and two
    refine reports were derived from it. Every one inherited Elsevier's provenance.
  audit-divergence: >-
    audit-university-contracts.py reaches its verdict from the HOSTNAME, and
    research-information.bris.ac.uk IS a bris.ac.uk subdomain, so the audit read all nine surfaces
    here as `institution` and reported hostless: none, shared_contract: none, misbased: none. That
    verdict is right about the host and wrong about the contract. This is the `shared_contract`
    class the contract describes for Pure and Dataverse deployments: the deployment is Bristol's,
    the document is the vendor's. Two things kept it out of the cohort-derived detector — the saved
    copy's title had been localized away from the vendor's own, and the live document's servers[]
    entry is the RELATIVE /ws/api, so host_of() returns nothing. The x-operator values in this file
    are the more precise call, reached from what each surface says about itself. Do not let a later
    host-based pass overwrite them.
  shared-contract-false-positive: >-
    The audit flags openapi/university-of-bristol-research-portal-oai-pmh-openapi.yml as a shared
    contract because the University of York ships a spec whose normalized title matches
    ("<Institution> Research Portal OAI-PMH"). It is not shared. Both were independently derived
    from each institution's own live endpoint, and the documents differ in host, metadata formats,
    set hierarchy, record count and observed defects — Bristol advertises seven metadata formats
    including uketd_dc and the OpenAIRE CERIF 1.2 profile across 3,878 sets with a broken Identify
    verb. This is the same class of false positive the contract already records for Washington's
    uw.edu contact domain and for Macquarie's OAI-PMH document.
  own-domain-note: >-
    Bristol uses TWO registrable domains — bristol.ac.uk for the public web and the legacy
    bris.ac.uk for research-information, idp and data.bris. Both are Bristol's. A `Portal` pointer
    to https://research-information.bris.ac.uk/ is present in common[] specifically so
    institution_domains() in audit-university-contracts.py can see bris.ac.uk; without it the audit
    reads every one of this repo's own hosts as `unknown`.
  note: >-
    The tenant relationship was NOT deleted. Bristol genuinely runs Pure, the data in it is
    Bristol's, and the relationship survives as university-of-bristol:pure-web-services with
    x-operator tenant. Only the contract and its derivatives went. In their place the repository now
    holds a contract for a surface Bristol actually operates itself — the OAI-PMH endpoint — derived
    from live probes, not from documentation and not from another institution's deployment.
