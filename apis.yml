    name: data.bris Research Data Repository
    x-operator: institution
    description: >-
      data.bris is the University of Bristol's own research data repository — institution-built and
      institution-hosted, not a Figshare, Dataverse or DSpace tenancy. DataCite lists it as client
      BL.BRISTOL, "University of Bristol", a member since 2012, and 1,552 DOIs have been minted
      under the institution's own prefix 10.5523/bris. It is a repository rather than an API: no
      search, OAI-PMH or REST interface answered on this host, and https://data.bris.ac.uk/data/oai
      returned 404. The dataset payload index at /datasets/ is a plain HTML directory listing served
      anonymously. Recorded honestly as an operational problem, not padded over: the
      DataCite-registered landing-page base https://data.bris.ac.uk/data/ returned HTTP 200 carrying
